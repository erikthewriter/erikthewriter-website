media:
  input: public/uploads
  output: /uploads
  rename: safe
content:
  - name: journal
    label: Journal posts
    type: collection
    path: src/content/journal
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, date, category, published]
      primary: title
      sort: date
      order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: description, label: Short description, type: text }
      - name: category
        label: Category
        type: select
        options:
          values: [Writing, Behind the Books, Announcements, Music, Other]
      - { name: image, label: Featured image, type: image }
      - { name: published, label: Published, type: boolean, default: false }
      - { name: audioUrl, label: Audio URL (optional), type: string, description: Direct URL to an MP3/audio file for the player. For streaming services, include a normal link in the article instead. }
      - { name: body, label: Article, type: rich-text }
  - name: products
    label: Shop products
    type: collection
    path: src/content/products
    format: yaml-frontmatter
    filename: "{primary}.md"
    fields:
      - { name: title, label: Product name, type: string, required: true }
      - { name: description, label: Product description, type: text }
      - { name: category, label: Category, type: string }
      - { name: image, label: Product image, type: image }
      - { name: amazonUrl, label: Amazon URL, type: string }
      - { name: payhipUrl, label: Payhip URL, type: string }
      - { name: otherLabel, label: Other seller name, type: string }
      - { name: otherUrl, label: Other seller URL, type: string }
      - { name: published, label: Show on website, type: boolean, default: false }
  - name: media
    label: Media entries
    type: collection
    path: src/content/media
    format: yaml-frontmatter
    filename: "{primary}.md"
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Description, type: text }
      - name: kind
        label: Media type
        type: select
        options:
          values: [Clip, VOD, Music, Video]
      - { name: image, label: Thumbnail, type: image }
      - { name: url, label: Twitch Clip, VOD, or external URL, type: string }
      - { name: published, label: Show on website, type: boolean, default: false }
  - name: series
    label: Book series
    type: collection
    path: src/content/series
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, status, published]
      primary: title
    fields:
      - { name: title, label: Series name, type: string, required: true }
      - { name: description, label: Short introduction, type: text }
      - { name: image, label: Series artwork, type: image }
      - name: status
        label: Series status
        type: select
        options:
          values: [Planned, In progress, Ongoing, Complete]
      - { name: order, label: Display order (number), type: number, default: 0 }
      - { name: published, label: Show on website, type: boolean, default: false }
      - { name: body, label: Series overview, type: rich-text }
  - name: books
    label: Books
    type: collection
    path: src/content/books
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, status, series, published]
      primary: title
    fields:
      - { name: title, label: Book title, type: string, required: true }
      - { name: subtitle, label: Subtitle, type: string }
      - { name: description, label: Short summary, type: text }
      - { name: series, label: Series ID (example day-of-the-end), type: string, description: Use the series entry filename without .md. Leave blank for standalones. }
      - { name: seriesNumber, label: Book number in series, type: number }
      - { name: cover, label: Book cover, type: image }
      - name: status
        label: Publication status
        type: select
        options:
          values: [Planned, Writing, Editing, Coming soon, Available]
      - { name: releaseDate, label: Release date (optional), type: date }
      - { name: isbnPaperback, label: Paperback ISBN, type: string }
      - { name: isbnHardcover, label: Hardcover ISBN, type: string }
      - { name: isbnEbook, label: eBook ISBN, type: string }
      - { name: amazonUrl, label: Legacy Amazon URL (optional), type: string }
      - { name: payhipUrl, label: Legacy Payhip URL (optional), type: string }
      - { name: ingramUrl, label: Additional retailer URL (Ingram or other), type: string }
      - { name: otherLabel, label: Other seller label, type: string }
      - { name: otherUrl, label: Other seller URL, type: string }
      - name: editions
        label: Editions and purchase options
        type: object
        description: Add each format once, with its own price, ISBN, availability and retailer links. Keep empty until ready.
        list:
          collapsible:
            collapsed: true
            summary: "{format} — {availability}"
        fields:
          - { name: format, label: Format (e.g. Paperback or Signed Hardcover), type: string, required: true }
          - { name: price, label: Listed price (USD), type: number, description: Optional. Number only, without dollar sign. }
          - { name: isbn, label: ISBN (if applicable), type: string }
          - name: availability
            label: Availability
            type: select
            options:
              values: [Available, Preorder, Coming soon, Unavailable]
          - name: retailers
            label: Where to buy
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - { name: name, label: Retailer name (Amazon / Payhip / etc.), type: string, required: true }
              - { name: url, label: Direct purchase link (optional), type: string, required: false }
      - { name: featured, label: Feature this book, type: boolean, default: false }
      - { name: published, label: Show on website, type: boolean, default: false }
      - { name: body, label: Full book description / excerpt, type: rich-text }

  - name: weeklyStreams
    label: Weekly stream schedule
    type: collection
    path: src/content/weekly-streams
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, day, time, status, published]
      primary: title
    fields:
      - { name: title, label: Stream title, type: string, required: true }
      - name: day
        label: Day of the week
        type: select
        options:
          values: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
      - { name: time, label: Start time (24-hour HH:MM), type: string, required: true, description: 'For 8 PM enter 20:00. Times are displayed in your chosen timezone.' }
      - { name: endTime, label: End time (optional HH:MM), type: string }
      - name: timezone
        label: Time zone
        type: select
        options:
          values: [America/Chicago, America/New_York, America/Denver, America/Los_Angeles]
        default: America/Chicago
      - { name: game, label: Featured game or activity, type: string }
      - { name: description, label: Short description, type: text }
      - name: status
        label: Schedule status
        type: select
        options:
          values: [Scheduled, Paused, Cancelled]
      - { name: displayOrder, label: Display order (optional), type: number }
      - { name: published, label: Show on website, type: boolean, default: false }
      - { name: discordPublish, label: Enable Discord synchronization later, type: boolean, default: false, description: 'Saved as a preference ONLY. Does not currently send Discord messages.' }
      - name: discordDestinations
        label: Planned Discord destinations
        type: select
        options:
          multiple: true
          values: ['The Haunted Library — Announcements', 'Magnificent Bastages — Events']
        description: 'These are destination labels. Channels and credentials will be configured separately.'
      - name: discordUpdateMode
        label: Discord update behavior (for future integration)
        type: select
        options:
          values: ['Quiet update', 'Update and notify', 'New announcement']
      - { name: body, label: More details, type: rich-text }
  - name: streamEvents
    label: Upcoming stream events
    type: collection
    path: src/content/stream-events
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, date, time, status, published]
      primary: title
      sort: date
      order: asc
    fields:
      - { name: title, label: Event title, type: string, required: true }
      - { name: date, label: Event date (YYYY-MM-DD), type: string, required: true, description: 'Example 2026-10-31. Keep as text to avoid date shifting across time zones.' }
      - { name: time, label: Start time (24-hour HH:MM), type: string, required: true, description: 'Example 20:00 for 8 PM.' }
      - name: timezone
        label: Time zone
        type: select
        options:
          values: [America/Chicago, America/New_York, America/Denver, America/Los_Angeles]
        default: America/Chicago
      - { name: game, label: Featured game or activity, type: string }
      - { name: description, label: Summary, type: text }
      - { name: image, label: Event image, type: image }
      - name: status
        label: Event status
        type: select
        options:
          values: [Scheduled, Postponed, Cancelled, Completed]
      - { name: published, label: Show on website, type: boolean, default: false }
      - { name: discordPublish, label: Enable Discord synchronization later, type: boolean, default: false, description: 'Saved as a preference ONLY. Does not currently send Discord messages.' }
      - name: discordDestinations
        label: Planned Discord destinations
        type: select
        options:
          multiple: true
          values: ['The Haunted Library — Announcements', 'Magnificent Bastages — Events']
      - name: discordUpdateMode
        label: Discord update behavior (for future integration)
        type: select
        options:
          values: ['Quiet update', 'Update and notify', 'New announcement']
      - { name: body, label: Event details, type: rich-text }

  - name: gameNotes
    label: Personal game settings
    type: collection
    path: src/content/game-notes
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [appid, rating, playStatus, lookingForPlayers, streaming]
      primary: appid
    fields:
      - { name: appid, label: Steam App ID (copy from library card), type: number, required: true, description: Save one entry per game. Keep the App ID unchanged. }
      - { name: rating, label: My rating (0 to 10, quarter increments), type: number, description: Leave empty for unrated. Use 0, 0.25, 0.5, etc. }
      - name: playStatus
        label: Played status
        type: select
        options:
          values: ['Never played','Played','Currently playing','Completed','Abandoned']
        default: Never played
      - { name: wantToPlay, label: Want to play, type: boolean, default: false }
      - name: lookingForPlayers
        label: Looking for players
        type: select
        options:
          values: ['Actively looking','Open to requests','Not actively looking']
        default: Not actively looking
      - name: streaming
        label: How often I stream this game
        type: select
        options:
          values: ['Regularly','Occasionally','Not currently']
        default: Not currently
      - name: collabPreference
        label: Personal preference (never blocks requests)
        type: select
        options:
          values: ['On-stream','Off-stream','Both','No preference']
        default: No preference
      - { name: featured, label: Feature game, type: boolean, default: false }
      - { name: genres, label: Genres (optional), type: string, list: true }
      - { name: modes, label: Play modes (optional, e.g. Single-player or Online Co-op), type: string, list: true }
      - { name: players, label: Player count (optional), type: string }
      - { name: review, label: My short review, type: text }

  - name: siteText
    label: Website Text
    type: collection
    path: src/content/site-text
    format: yaml-frontmatter
    filename: "{primary}.md"
    fields:
      - { name: heroEyebrow, label: Homepage small heading, type: string }
      - { name: heroTitle, label: Homepage main headline, type: string }
      - { name: heroDescription, label: Homepage welcome paragraph, type: text }
      - { name: writingCardTitle, label: Writing card heading, type: string }
      - { name: writingCardDescription, label: Writing card description, type: text }
      - { name: streamingCardTitle, label: Streaming card heading, type: string }
      - { name: streamingCardDescription, label: Streaming card description, type: text }
      - { name: featureTitle, label: Featured fiction title, type: string }
      - { name: featureDescription, label: Featured fiction description, type: text }
      - { name: readingHeading, label: Homepage reading section heading, type: string }
      - { name: readingIntro, label: Homepage reading section intro, type: text }
      - { name: promotionsHeading, label: Promotions heading, type: string }
      - { name: journalHeading, label: Journal heading, type: string }
  - name: reading
    label: Reading & Indie Authors
    type: collection
    path: src/content/reading
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, author, status, published]
      primary: title
    fields:
      - { name: title, label: Book title, type: string, required: true }
      - { name: author, label: Author, type: string, required: true }
      - { name: cover, label: Cover image, type: image }
      - { name: genre, label: Genre, type: string }
      - name: status
        label: Reading or spotlight status
        type: select
        options:
          values: ['Want to Read', 'Currently Reading', 'Finished', 'Indie Author Spotlight']
        default: Indie Author Spotlight
      - { name: description, label: Description, type: text }
      - { name: myThoughts, label: My thoughts (optional), type: text }
      - { name: bookUrl, label: Buy or find book URL, type: string }
      - { name: authorUrl, label: Author website URL, type: string }
      - { name: featured, label: Feature on homepage, type: boolean, default: false, description: Featured entries appear before others. Up to three appear on homepage. }
      - { name: displayOrder, label: Display order, type: number, default: 0 }
      - { name: published, label: Show on website, type: boolean, default: false }
  - name: promotions
    label: Specials & Collaborations
    type: collection
    path: src/content/promotions
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, partner, active, startDate, endDate]
      primary: title
    fields:
      - { name: title, label: Promotion title, type: string, required: true }
      - { name: partner, label: Collaborating creator or business, type: string }
      - { name: image, label: Promotional image, type: image }
      - { name: description, label: Offer details and conditions, type: text }
      - { name: linkText, label: Button text, type: string, default: See details }
      - { name: url, label: Offer URL, type: string }
      - { name: startDate, label: Start date (optional YYYY-MM-DD), type: string, description: Leave empty for no start date. }
      - { name: endDate, label: End date (optional YYYY-MM-DD), type: string, description: Leave empty for no end date. }
      - { name: displayOrder, label: Display order, type: number, default: 0 }
      - { name: active, label: Promotion active, type: boolean, default: false, description: Disable to hide completely without deleting. Up to five active promotions appear on homepage. }

  - name: partners
    label: Sponsors & Featured Businesses
    type: collection
    path: src/content/partners
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [name, category, active, featured, displayOrder]
      primary: name
    fields:
      - { name: name, label: Business or sponsor name, type: string, required: true }
      - { name: logo, label: Logo or image, type: image }
      - name: category
        label: Partner category
        type: select
        options:
          values: ['Sponsor', 'Featured Business', 'Community Partner', 'Affiliate']
        default: Featured Business
      - { name: description, label: About this business, type: text }
      - { name: websiteUrl, label: Business website URL (optional), type: string }
      - name: relationship
        label: Relationship disclosure
        type: select
        options:
          values: ['None', 'Paid sponsorship', 'Affiliate relationship', 'Gifted products or services', 'Independent recommendation', 'Community collaboration']
        default: None
      - { name: featured, label: Feature on homepage, type: boolean, default: false, description: Show on homepage when active. The homepage displays up to five featured partners. }
      - { name: displayOrder, label: Display order, type: number, default: 0 }
      - { name: active, label: Show on website, type: boolean, default: false, description: Leave on indefinitely; disable manually to hide without deleting. No automatic expiration. }

  - name: socialLinks
    label: Social & Community Links
    type: collection
    path: src/content/social-links
    format: yaml-frontmatter
    filename: "{primary}.md"
    fields:
      - { name: twitch, label: Twitch URL, type: string, description: Leave blank to hide a social link. Use a full https:// URL. }
      - { name: discord, label: Discord invite URL, type: string }
      - { name: youtube, label: YouTube URL, type: string }
      - { name: steam, label: Steam profile URL, type: string }
      - { name: instagram, label: Instagram URL, type: string }
      - { name: facebook, label: Facebook URL, type: string }
      - { name: tiktok, label: TikTok URL, type: string }
      - { name: bluesky, label: Bluesky URL, type: string }
      - { name: x, label: X (Twitter) URL, type: string }
      - { name: goodreads, label: Goodreads URL, type: string }
      - { name: other, label: Other website URL, type: string }
