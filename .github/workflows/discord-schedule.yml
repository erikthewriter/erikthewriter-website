name: Sync schedule to Discord
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/content/weekly-streams/**'
      - 'src/content/stream-events/**'
      - 'scripts/sync_discord.py'
      - '.github/workflows/discord-schedule.yml'
concurrency:
  group: discord-schedule
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.2'
      - name: Sync selected events
        env:
          DISCORD_WEBHOOK_HAUNTED_LIBRARY: ${{ secrets.DISCORD_WEBHOOK_HAUNTED_LIBRARY }}
          DISCORD_WEBHOOK_MAGNIFICENT_BASTAGES: ${{ secrets.DISCORD_WEBHOOK_MAGNIFICENT_BASTAGES }}
        run: python scripts/sync_discord.py
      - name: Store message IDs for future edits
        run: |
          if ! git diff --quiet -- .discord-sync/state.json || [ -n "$(git ls-files --others --exclude-standard .discord-sync/state.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .discord-sync/state.json
            git commit -m 'Track Discord schedule message IDs [skip ci]'
            git push origin HEAD:main
          fi
